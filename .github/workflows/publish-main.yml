name: Publish Xolo main documentation

on:
  repository_dispatch:
    types:
      - xolo-main

  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: documentation-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # EXPERTS_TOKEN est un secret de l'environnement github-pages :
    # sans cette déclaration, le job ne le voit pas. La branche main y
    # est autorisée par la politique de branches de l'environnement.
    environment: github-pages

    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.lock

      - name: Install local documentation tools
        run: make tools-sync

      - name: Prepare documentation sources
        env:
          XOLO_REF: main
          XOLO_REPOSITORY: https://github.com/xolo-gateway/xolo.git
          EXPERTS_TOKEN: ${{ secrets.EXPERTS_TOKEN }}
          # Obligatoire seulement si le jeton existe : un jeton absent laisse
          # publier sans la page, un jeton présent mais cassé arrête le build
          # plutôt que de retirer la page du site en silence.
          EXPERTS_REQUIRED: ${{ secrets.EXPERTS_TOKEN != '' }}
        run: make prepare

      - name: Verify checked-out commit
        if: github.event_name == 'repository_dispatch'
        env:
          EXPECTED_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail

          actual_sha="$(git -C .cache/xolo rev-parse HEAD)"

          if [[ -z "${EXPECTED_SHA}" ]]; then
            echo "Aucun SHA attendu fourni, vérification ignorée"
            exit 0
          fi

          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "SHA inattendu (course entre deux pushes ?)" >&2
            echo "Attendu : ${EXPECTED_SHA}" >&2
            echo "Obtenu  : ${actual_sha}" >&2
            exit 1
          fi

      - name: Validate documentation (fr, en, es)
        run: make check-all

      # Pose llms.txt à la racine de chaque site/<lang>/ construit par
      # check-all, pour qu'il soit publié avec le reste.
      - name: Copy llms.txt into built sites
        run: make copy-llms-txt

      - name: Configure Git identity
        run: |
          git config user.name "xolo-docs-bot"
          git config user.email "xolo-docs-bot@users.noreply.github.com"

      - name: Fetch gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/xolo-gateway/docs.git"
          git fetch origin gh-pages || true

      # Publie dans ./main/, ./en/main/, ./es/main/ et (re)pointe les alias
      # ./dev/, ./en/dev/, ./es/dev/ vers leur ./main/ respectif.
      - name: Publish main documentation with Mike (fr, en, es)
        run: |
          make publish-all \
            VERSION=main \
            ALIASES=dev \
            PUSH=true

      - name: Export gh-pages for GitHub Pages
        run: |
          set -euo pipefail

          rm -rf pages-output
          mkdir pages-output

          git archive origin/gh-pages | tar -x -C pages-output

          touch pages-output/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-output

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
