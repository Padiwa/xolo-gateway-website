name: Publish Xolo documentation

on:
  repository_dispatch:
    types:
      - xolo-release

  workflow_dispatch:
    inputs:
      xolo_ref:
        description: "Tag, branche ou SHA de xolo-gateway/xolo"
        required: true
        type: string

      version:
        description: "Nom public de la version, vide pour le déduire du tag"
        required: false
        type: string

      update_latest:
        description: "Déplacer l'alias latest vers cette version"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: documentation-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # EXPERTS_TOKEN est un secret de l'environnement github-pages :
    # sans cette déclaration, le job ne le voit pas. La branche main y
    # est autorisée par la politique de branches de l'environnement.
    environment: github-pages

    outputs:
      version: ${{ steps.metadata.outputs.version }}
      xolo_ref: ${{ steps.metadata.outputs.xolo_ref }}

    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine publication metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          MANUAL_REF: ${{ inputs.xolo_ref }}
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "repository_dispatch" ]]; then
            xolo_ref="${DISPATCH_REF}"
            expected_sha="${DISPATCH_SHA}"
            update_latest="true"
          else
            xolo_ref="${MANUAL_REF}"
            expected_sha=""
            update_latest="${MANUAL_UPDATE_LATEST}"
          fi

          if [[ -z "${xolo_ref}" ]]; then
            echo "La référence Xolo est vide" >&2
            exit 1
          fi

          # La référence est passée à git clone --branch : on interdit tout ce
          # qui ne ressemble pas à un nom de ref Git.
          if [[ ! "${xolo_ref}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "Référence Xolo invalide: ${xolo_ref}" >&2
            exit 1
          fi

          if [[ -n "${expected_sha}" && ! "${expected_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SHA Xolo invalide: ${expected_sha}" >&2
            exit 1
          fi

          if [[ -n "${MANUAL_VERSION:-}" ]]; then
            version="$(./scripts/normalize-version.sh "${MANUAL_VERSION}")"
          else
            version="$(./scripts/normalize-version.sh "${xolo_ref}")"
          fi

          {
            echo "xolo_ref=${xolo_ref}"
            echo "version=${version}"
            echo "expected_sha=${expected_sha}"
            echo "update_latest=${update_latest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.lock

      - name: Install local documentation tools
        run: make tools-sync

      - name: Prepare documentation sources
        env:
          XOLO_REF: ${{ steps.metadata.outputs.xolo_ref }}
          XOLO_REPOSITORY: https://github.com/xolo-gateway/xolo.git
          EXPERTS_TOKEN: ${{ secrets.EXPERTS_TOKEN }}
          # Obligatoire seulement si le jeton existe : un jeton absent laisse
          # publier sans la page, un jeton présent mais cassé arrête le build
          # plutôt que de retirer la page du site en silence.
          EXPERTS_REQUIRED: ${{ secrets.EXPERTS_TOKEN != '' }}
        run: make prepare

      - name: Verify checked-out commit
        if: github.event_name == 'repository_dispatch'
        env:
          EXPECTED_SHA: ${{ steps.metadata.outputs.expected_sha }}
        run: |
          set -euo pipefail

          actual_sha="$(git -C .cache/xolo rev-parse HEAD)"

          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "SHA inattendu" >&2
            echo "Attendu : ${EXPECTED_SHA}" >&2
            echo "Obtenu  : ${actual_sha}" >&2
            exit 1
          fi

      - name: Validate documentation (fr, en, es)
        run: make check-all

      # Pose llms.txt à la racine de chaque site/<lang>/ construit par
      # check-all, pour qu'il soit publié avec le reste.
      - name: Copy llms.txt into built sites
        run: make copy-llms-txt

      - name: Configure Git identity
        run: |
          git config user.name "xolo-docs-bot"
          git config user.email "xolo-docs-bot@users.noreply.github.com"

      - name: Fetch gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/xolo-gateway/docs.git"
          git fetch origin gh-pages || true

      # Publie dans ./<version>/, ./en/<version>/, ./es/<version>/ ; l'alias
      # latest est une page de redirection HTML, et set-default régénère
      # l'index racine (par langue) qui redirige vers ./latest/.
      - name: Publish version with Mike (fr, en, es)
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          UPDATE_LATEST: ${{ steps.metadata.outputs.update_latest }}
        run: |
          set -euo pipefail

          if [[ "${UPDATE_LATEST}" == "true" ]]; then
            make publish-all \
              VERSION="${VERSION}" \
              ALIASES="latest" \
              PUSH=true

            make set-default-all DEFAULT=latest PUSH=true
          else
            make publish-all \
              VERSION="${VERSION}" \
              PUSH=true
          fi

      - name: Export gh-pages for GitHub Pages
        run: |
          set -euo pipefail

          rm -rf pages-output
          mkdir pages-output

          git archive origin/gh-pages | tar -x -C pages-output

          touch pages-output/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-output

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
